[project]
name = "gridforge-optimizer"
version = "0.1.0"
description = "Deterministic connection-queue optimizer + LLM narration for GridForge"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pandapower>=3.5.5",
    "networkx>=3.4.2",
    "openai>=3.22.1",
    "pydantic>=2.11",
    "numba>=0.60",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridforge_optimizer"]
