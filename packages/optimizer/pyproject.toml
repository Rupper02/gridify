[project]
name = "gridify-optimizer"
version = "0.1.0"
description = "Deterministic grid engine for Gridify: AC power flow through the plan years"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pandapower>=3.5.5",
    "networkx>=3.4.2",
    "pydantic>=2.11",
    "numba>=0.60",
    "lxml>=6.1.3",
]

[dependency-groups]
dev = [
    "lxml>=6.1.3",
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
addopts = "-n 4"  # modules in parallel (pytest-xdist); each worker pays numba's JIT once

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridify_optimizer"]
