[project]
name = "forecast"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chronos-forecasting==2.3.2",
    "ipykernel>=7.4.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "pandas>=3.0.6",
    "timestral",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

[tool.uv.sources]
timestral = { git = "https://github.com/mistralai/timestral", rev = "a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff" }
