[project]
name = "grid_simulator"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.24",
    "duckdb>=1.5.6",
    "networkx>=3.4.2",
    "pandapower>=3.5.5",
    "gridify-optimizer",
]

[tool.uv.sources]
gridify-optimizer = { path = "../../packages/optimizer", editable = true }

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "grid_simulator"
code_location_name = "grid_simulator.definitions"  # the name `-m grid_simulator.definitions` registers it under


