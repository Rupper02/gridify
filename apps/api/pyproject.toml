[project]
name = "gridify-api"
version = "0.1.0"
requires-python = ">=3.10,<3.15"
dependencies = [
    "fastapi[standard]>=0.115",
    "duckdb>=1.5.6",
    "gridify-optimizer",
    "psycopg[binary]>=3.3.6",
]

[tool.uv.sources]
gridify-optimizer = { path = "../../packages/optimizer", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridify_api"]
